name: iSpend
options:
  bundleIdPrefix: com.ispend
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  iSpend:
    type: application
    platform: iOS
    sources: iSpend
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ispend.app
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: iSpend
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
      INFOPLIST_KEY_NSCameraUsageDescription: "iSpend uses photos only when you attach a receipt."
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "iSpend uses photos only when you attach a receipt."
      INFOPLIST_KEY_NSUserNotificationsUsageDescription: "iSpend uses notifications for budgets, subscriptions, repayments, and savings reminders you enable."
  iSpendTests:
    type: bundle.unit-test
    platform: iOS
    sources: iSpendTests
    dependencies:
      - target: iSpend
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ispend.tests
      GENERATE_INFOPLIST_FILE: YES
