name: iSpend
options:
  bundleIdPrefix: com.ispend
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 1.1.2
    CURRENT_PROJECT_VERSION: 3
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  iSpend:
    type: application
    platform: iOS
    sources: iSpend
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ispend.app
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_COMPILATION_MODE: incremental
      INFOPLIST_KEY_CFBundleDisplayName: iSpend
      INFOPLIST_KEY_NSSupportsLiveActivities: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIRequiresFullScreen: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
        - UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
      INFOPLIST_KEY_NSCameraUsageDescription: "iSpend uses photos only when you attach a receipt."
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "iSpend uses photos only when you attach a receipt."
      INFOPLIST_KEY_NSUserNotificationsUsageDescription: "iSpend uses notifications for budgets, subscriptions, repayments, and savings reminders you enable."
    dependencies:
      - target: iSpendLiveActivity
        embed: true
  iSpendLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: iSpendLiveActivity
      - path: iSpend/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ispend.app.liveactivity
      GENERATE_INFOPLIST_FILE: YES
      SKIP_INSTALL: YES
      APPLICATION_EXTENSION_API_ONLY: YES
      INFOPLIST_KEY_CFBundleDisplayName: iSpend 财务总览
      INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
  iSpendTests:
    type: bundle.unit-test
    platform: iOS
    sources: iSpendTests
    dependencies:
      - target: iSpend
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ispend.tests
      GENERATE_INFOPLIST_FILE: YES
