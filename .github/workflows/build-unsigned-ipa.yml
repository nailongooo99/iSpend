name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project iSpend.xcodeproj \
            -scheme iSpend \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/iSpend.app"
          test -d "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$INFO_PLIST")" = "1.1.1"
          test "$(plutil -extract CFBundleVersion raw -o - "$INFO_PLIST")" = "2"
          test "$(plutil -extract UIRequiresFullScreen raw -o - "$INFO_PLIST")" = "true"
          plutil -extract UILaunchScreen xml1 -o - "$INFO_PLIST" >/dev/null
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/iSpend.app"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/iSpend-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iSpend-unsigned-ipa
          path: iSpend-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "iSpend-unsigned.ipa#iSpend-${GITHUB_REF_NAME}-unsigned.ipa" \
            --title "iSpend ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
