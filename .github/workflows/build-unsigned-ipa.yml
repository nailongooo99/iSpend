name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project iSpend.xcodeproj \
            -scheme iSpend \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/iSpend.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/iSpend.app"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/iSpend-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iSpend-unsigned-ipa
          path: iSpend-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            iSpend-unsigned.ipa#iSpend-v1.0.0-unsigned.ipa \
            --title "iSpend 1.0.0" \
            --notes "iSpend 1.0.0 首个正式发行版。使用 Swift 6、SwiftUI 与 SwiftData 构建。此附件为未签名 IPA，安装前必须使用你自己的 Apple 开发证书重新签名。" \
            --verify-tag
